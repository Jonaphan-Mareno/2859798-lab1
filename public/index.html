<!DOCTYPE html>
<html lang="en">
<head>
    <title>My unCool Project</title>
    <style>
        /* This container puts the cards side-by-side with a gap */
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        /* This is the actual card design */
        .card {
            border: 1px solid #ddd;
            border-radius: 10px;           /* Rounded corners */
            padding: 15px;                 /* Space inside the card */
            width: 250px;                  /* Fixed width */
            box-shadow: 2px 4px 8px rgba(0,0,0,0.1); /* The drop shadow */
            background-color: #fafafa;
            font-family: sans-serif;
        }

        /* Make the task title look clean */
        .card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
        }

        /* Make the description look like normal text */
        .card p {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
        }

        /* A stylish little pill-shape for the Topic */
        .topic-badge {
            background-color: #007bff;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
  
    <h1>To do list</h1>  
    <input id="taskTitle"> Title</input>
    <input id="taskDesc"> Description</input>
    <input id="taskTopic"> Topic</input>
    <input id="taskDue"> DueDate</input>
    <button id="myButton">  Add a Task  </button> 
    <div id="lol" class="card-container">You have nothing lil bro UI.</div>
    <script>
        const button = document.getElementById('myButton');
        const button2 = document.getElementById('myButton2');
        const resultText = document.getElementById('lol');
        async function loadTasks() {
            const response  = await fetch('/api/tasks');
  
            const tasks = await response.json();
         
            resultText.innerHTML = "";
            tasks.forEach(task => {
                // 3. Create a bullet point for each task, pulling out the specific columns we want
                resultText.innerHTML += `
                    <div class="card">
                        <span class="topic-badge">${task.Topic || 'No Topic'}</span> <span class="topic-badge">${task.status}</span> 
                        <h3>${task.title}</h3>
                        <p>${task.Description || 'No description provided'}</p>
                        <p><strong>Due:</strong> ${task.Due_date || 'No date set'}</p>
                    </div>
                `;
                });}
        button.addEventListener('click', async () => {
            const newTitle = document.getElementById('taskTitle').value;
            const newDesc = document.getElementById('taskDesc').value;
            const newTopic = document.getElementById('taskTopic').value;
            const newDue = document.getElementById('taskTopic').value;
            const newTask = {
        title: newTitle,
        Description: newDesc,
        Due_date: newDue||"TBA", 
        Topic: newTopic,
        status: "To Do"
    };
    await fetch('/api/addtasks', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(newTask)
        
    });
    document.getElementById('taskTitle').value = "";
    document.getElementById('taskDesc').value = "";
    document.getElementById('taskTopic').value = "";
    document.getElementById('taskDue').value = "";
    loadTasks();

        });
            
                loadTasks();
      
    </script>
</body>
</html>
