<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do App</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f7f6; }
        
        input[type="text"], input[type="date"], select {
            padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 200px;
        }
        button {
            padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer;
            background-color: #007bff; color: white; font-weight: bold;
        }
        button:hover { opacity: 0.9; }

        .controls-container {
            display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
        }
        .card-container {
            display: flex; flex-wrap: wrap; gap: 20px; margin-top: 15px;
        }

        .card {
            border: 1px solid #ddd; border-radius: 10px; padding: 15px; 
            width: 250px; box-shadow: 2px 4px 8px rgba(0,0,0,0.1); 
            background-color: #fff; display: flex; flex-direction: column;
        }
        .card h3 { margin-top: 0; margin-bottom: 10px; color: #333; }
        .card p { margin: 5px 0; color: #666; font-size: 14px; }
        
        /* Archived Card Design */
        .card.archived-look {
            background-color: #e9ecef; border: 1px dashed #adb5bd; 
            box-shadow: none; opacity: 0.7;
        }
        .card.archived-look h3 { color: #6c757d; text-decoration: line-through; }

        
        .badge-container { margin-bottom: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
        .topic-badge { background-color: #007bff; color: white; padding: 4px 10px; border-radius: 15px; font-size: 12px; }
        .status-badge { background-color: #00ff33; color: white; padding: 4px 10px; border-radius: 15px; font-size: 12px; }
        .overdue-badge { background-color: #ff0000; color: white; padding: 4px 10px; border-radius: 15px; font-size: 12px; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 10px; width: 320px;
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
        }
        .modal-content input, .modal-content select { width: auto; }
    </style>
</head>
<body>
  
    <h1>To do list</h1>  

    <div class="controls-container">
        <input type="text" id="taskTitle" placeholder="Task Title">
        <input type="text" id="taskDesc" placeholder="Description">
        <input type="text" id="taskTopic" placeholder="Topic">
        <input type="date" id="taskDue">
        <button id="myButton">Add a Task</button> 
    </div>

    <div class="controls-container">
        <label for="sortDropdown"><strong>Sort by: </strong></label>
        <select id="sortDropdown">
            <option value="Topic">Topic</option>
            <option value="status">Status</option>
            <option value="Due_date">Due Date</option>
        </select>
    </div>

    <hr style="border: 0; border-top: 2px solid #ccc; margin: 20px 0;">

    <h2>Current Tasks</h2>
    <div id="lol" class="card-container">Loading tasks...</div>
    
    <hr style="border: 0; border-top: 2px solid #ccc; margin: 40px 0;">

    <h2>Archived Tasks</h2>
    <div id="lol2" class="card-container">Loading tasks...</div>


    <!-- Hidden Edit Modal UI -->
    <div id="editModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 style="margin-top: 0;">Edit Task</h2>
            
            <input type="hidden" id="editId">
            <input type="text" id="editTitle" placeholder="Title">
            <input type="text" id="editDesc" placeholder="Description">
            <input type="date" id="editDate">
            <input type="text" id="editTopic" placeholder="Topic">
            
            <label style="font-weight: bold; font-size: 14px;">Status:</label>
            <select id="editStatus">
                <option value="Todo">Todo</option>
                <option value="In-Progress">In-Progress</option>
                <option value="Complete">Complete</option>
            </select>
            
            <label style="display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 14px; cursor: pointer;">
                <input type="checkbox" id="editArchived">
                Archive this task
            </label>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="saveEdit()" style="flex: 1; background: #28a745;">Save</button>
                <button onclick="closeModal()" style="flex: 1; background: #6c757d;">Cancel</button>
            </div>
        </div>
    </div>


    
    <script>
        let allTasks = [];
        
        const currentTasksContainer = document.getElementById('lol');
        const archivedTasksContainer = document.getElementById('lol2');
        const sortDropdown = document.getElementById('sortDropdown');
        const addTaskBtn = document.getElementById('myButton');

        
        function buildCardHTML(task) {
            const today = new Date().toISOString().split('T')[0];
            let overdueHTML = "";
            const archiveClass = task.is_archived === 1 ? "archived-look" : "";
            
            if (task.Due_date && task.Due_date < today && task.status !== "Complete" && task.is_archived !== 1) {
                overdueHTML = `<span class="overdue-badge">Overdue</span>`;
            }
            
            return `
                <div class="card ${archiveClass}">
                    <div class="badge-container">
                        <span class="topic-badge">${task.Topic || 'No Topic'}</span> 
                        <span class="status-badge">${task.status}</span> 
                        ${overdueHTML}
                    </div>
                    <h3>${task.title}</h3>
                    <p>${task.Description || 'No description provided'}</p>
                    
                    <!-- Pushes the bottom items down dynamically -->
                    <div style="margin-top: auto;">
                        <p><strong>Due:</strong> ${task.Due_date || 'No date set'}</p>
                        <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
                        <div style="display: flex; gap: 10px;">
                            <button onclick="editTask(${task.id})" style="flex: 1; padding: 5px;">Edit</button>
    
                        </div>
                    </div>
                </div>
            `;
        }
        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks');
                allTasks = await response.json();

                let tasks = [...allTasks];
                const sortBy = sortDropdown.value;

                tasks.sort((a, b) => {
                    let valueA = a[sortBy] || ""; 
                    let valueB = b[sortBy] || "";
                    if (valueA < valueB) return -1;
                    if (valueA > valueB) return 1;
                    return 0;
                });

                let currentHTML = "";
                let archivedHTML = "";

                tasks.forEach(task => {
                    const card = buildCardHTML(task);
                    if (task.is_archived === 1) { 
                        archivedHTML += card;
                    } else {
                        currentHTML += card;
                    }
                });

                currentTasksContainer.innerHTML = currentHTML || "<p style='color: #888;'>No current tasks.</p>";
                archivedTasksContainer.innerHTML = archivedHTML || "<p style='color: #888;'>No archived tasks.</p>";
            } catch (error) {
                console.error("Error loading tasks:", error);
            }
        }

        addTaskBtn.addEventListener('click', async () => {
            const titleInput = document.getElementById('taskTitle').value;
            if (!titleInput) return alert("Task title cannot be empty!");

            try {
                const newTask = {
                    title: titleInput,
                    Description: document.getElementById('taskDesc').value,
                    Topic: document.getElementById('taskTopic').value,
                    Due_date: document.getElementById('taskDue').value || "", 
                    status: "Todo" 
                };

                await fetch('/api/addtasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newTask)
                });

                // Clear input boxes
                document.getElementById('taskTitle').value = "";
                document.getElementById('taskDesc').value = "";
                document.getElementById('taskTopic').value = "";
                document.getElementById('taskDue').value = "";
                
                loadTasks();
            } catch (error) {
                console.error("Error adding task:", error);
            }
        });

    

        function editTask(id) {
            const task = allTasks.find(t => t.id === id);
            if (!task) return;

            document.getElementById('editId').value = task.id;
            document.getElementById('editTitle').value = task.title || "";
            document.getElementById('editDesc').value = task.Description || "";
            document.getElementById('editDate').value = task.Due_date || "";
            document.getElementById('editTopic').value = task.Topic || "";
            document.getElementById('editStatus').value = task.status || "Todo";
            document.getElementById('editArchived').checked = (task.is_archived === 1);

            document.getElementById('editModal').style.display = "flex";
        }
        function closeModal() {
            document.getElementById('editModal').style.display = "none";
        }

        async function saveEdit() {
            try {
                const id = document.getElementById('editId').value;
                const updatedTask = {
                    title: document.getElementById('editTitle').value,
                    Description: document.getElementById('editDesc').value,
                    Due_date: document.getElementById('editDate').value,
                    Topic: document.getElementById('editTopic').value,
                    status: document.getElementById('editStatus').value,
                    is_archived: document.getElementById('editArchived').checked ? 1 : 0
                };

                await fetch(`/api/edittask/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedTask)
                });

                closeModal();
                loadTasks();
            } catch (error) {
                console.error("Error saving task:", error);
            }
        }

        sortDropdown.addEventListener('change', loadTasks);

        loadTasks();
    </script>
</body>
</html>
